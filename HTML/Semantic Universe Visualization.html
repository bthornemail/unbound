<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Universe</title>
  <style>
    body { 
      margin: 0; 
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    canvas { 
      display: block; 
      position: fixed;
      top: 0;
      left: 0;
    }
    .controls {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      color: white;
      z-index: 100;
      max-width: 600px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #333;
      color: white;
    }
    button {
      background: #4CAF50;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #45a049;
    }
    .forms-container {
      display: flex;
      gap: 20px;
    }
    .form-section {
      flex: 1;
    }
    h3 {
      margin-top: 0;
      color: #4CAF50;
    }
    .word-list {
      max-height: 150px;
      overflow-y: auto;
      margin-top: 15px;
      padding: 5px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
    }
    .word-item {
      padding: 5px;
      margin-bottom: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <div class="forms-container">
      <div class="form-section">
        <h3>Add Word-Definition Pair</h3>
        <div class="form-group">
          <label for="word">Word:</label>
          <input type="text" id="word" placeholder="Enter word">
        </div>
        <div class="form-group">
          <label for="definition">Definition:</label>
          <textarea id="definition" rows="3" placeholder="Enter definition"></textarea>
        </div>
        <div class="form-group">
          <label for="pos">Part of Speech:</label>
          <select id="pos">
            <option value="noun">Noun</option>
            <option value="verb">Verb</option>
            <option value="adjective">Adjective</option>
            <option value="pronoun">Pronoun</option>
            <option value="other">Other</option>
          </select>
        </div>
        <button id="addWordBtn">Add Word Point</button>
        
        <div class="word-list" id="wordList">
          <!-- Word list will be populated here -->
        </div>
      </div>

      <div class="form-section">
        <h3>Create Sentence Tetrahedron</h3>
        <div class="form-group">
          <label for="noun">Noun:</label>
          <select id="noun"></select>
        </div>
        <div class="form-group">
          <label for="verb">Verb:</label>
          <select id="verb"></select>
        </div>
        <div class="form-group">
          <label for="adjective">Adjective:</label>
          <select id="adjective"></select>
        </div>
        <div class="form-group">
          <label for="pronoun">Pronoun:</label>
          <select id="pronoun"></select>
        </div>
        <button id="createSentenceBtn">Create Sentence</button>
        
        <div class="form-group">
          <label for="sentence-display">Generated Sentence:</label>
          <div id="sentence-display" style="background: #222; padding: 10px; border-radius: 4px; min-height: 20px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';
    import { OrbitControls } from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/jsm/controls/OrbitControls.js';

    // Define the LanguageTetrahedron class
    class LanguageTetrahedron {
      static getResonance(word, def) {
        const wordHash = this.stringToHash(word);
        const defHash = this.stringToHash(def);
        return Math.abs(Math.cos((wordHash - defHash) % 1000));
      }

      static getWordVector(word, def, time) {
        const c = this.getResonance(word, def);
        const phase = c * (time % 628) / 100;
        const radius = 5 + (c * 2); // Base radius plus a factor of resonance
        return {
          x: radius * Math.sin(phase),
          y: radius * Math.sin(phase + 2.094),
          z: radius * Math.sin(phase + 4.188),
          t: time,
          c: c
        };
      }

      static getCentroid(points) {
        const sum = points.reduce((acc, p) => ({
          x: acc.x + p.x,
          y: acc.y + p.y,
          z: acc.z + p.z,
          t: acc.t + p.t,
          c: acc.c + p.c
        }), {x: 0, y: 0, z: 0, t: 0, c: 0});

        return {
          x: sum.x / points.length,
          y: sum.y / points.length,
          z: sum.z / points.length,
          t: sum.t,
          c: sum.c / points.length
        };
      }

      static buildSentenceTetrahedron(words, defs, time) {
        if (words.length !== 4 || defs.length !== 4) {
          throw new Error("Exactly 4 words and definitions required");
        }

        const vertices = words.map((w, i) => 
          this.getWordVector(w, defs[i], time));
        
        const centroid = this.getCentroid(vertices);
        const frequency = Math.sqrt(
          vertices.reduce((sum, v) => sum + Math.pow(v.c - centroid.c, 2), 0) / vertices.length
        );

        return { vertices, centroid, frequency };
      }

      static stringToHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash) / 2147483647; // Normalize between 0 and 1
      }
    }

    class SemanticUniverse {
      constructor() {
        this.words = [];
        this.sentences = [];
        this.wordDefMap = new Map();
        this.posMap = new Map(); // Map words to their part of speech
        this.clock = new THREE.Clock();
        this.elapsedTime = 0;
        
        this.initThree();
        this.initUI();
        this.animate();
      }

      initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x050510);
        
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        this.camera.position.z = 15;

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(this.renderer.domElement);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;

        // Add lights
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(0, 10, 10);
        this.scene.add(light);
        this.scene.add(new THREE.AmbientLight(0x404040));

        // Add grid helper
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        this.scene.add(gridHelper);
        
        // Handle window resize
        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      initUI() {
        // Word-Definition Form
        document.getElementById('addWordBtn').addEventListener('click', () => {
          const word = document.getElementById('word').value.trim();
          const definition = document.getElementById('definition').value.trim();
          const pos = document.getElementById('pos').value;
          
          if (word && definition) {
            this.addWordDefinition(word, definition, pos);
            document.getElementById('word').value = '';
            document.getElementById('definition').value = '';
            this.updateWordLists();
            this.updateWordSelects();
          }
        });

        // Sentence Form
        document.getElementById('createSentenceBtn').addEventListener('click', () => {
          const noun = document.getElementById('noun').value;
          const verb = document.getElementById('verb').value;
          const adjective = document.getElementById('adjective').value;
          const pronoun = document.getElementById('pronoun').value;
          
          if (noun && verb && adjective && pronoun) {
            const sentence = `${pronoun} ${adjective} ${noun} ${verb}`;
            document.getElementById('sentence-display').textContent = sentence;
            this.createSentenceTetrahedron([noun, verb, adjective, pronoun]);
          }
        });
      }

      updateWordLists() {
        const wordList = document.getElementById('wordList');
        wordList.innerHTML = '';
        
        this.wordDefMap.forEach((def, word) => {
          const pos = this.posMap.get(word);
          const wordItem = document.createElement('div');
          wordItem.className = 'word-item';
          wordItem.textContent = `${word} (${pos}): ${def.substring(0, 30)}${def.length > 30 ? '...' : ''}`;
          wordList.appendChild(wordItem);
        });
      }

      updateWordSelects() {
        // Update noun select
        this.updateSelect('noun', 'noun');
        
        // Update verb select
        this.updateSelect('verb', 'verb');
        
        // Update adjective select
        this.updateSelect('adjective', 'adjective');
        
        // Update pronoun select
        this.updateSelect('pronoun', 'pronoun');
      }

      updateSelect(selectId, pos) {
        const select = document.getElementById(selectId);
        select.innerHTML = '';
        
        // Add empty option
        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = `Select ${pos}`;
        select.appendChild(emptyOption);
        
        // Add words of the specific part of speech
        this.wordDefMap.forEach((def, word) => {
          const wordPos = this.posMap.get(word);
          if (wordPos === pos || pos === 'other') {
            const option = document.createElement('option');
            option.value = word;
            option.textContent = word;
            select.appendChild(option);
          }
        });
      }

      addWordDefinition(word, definition, pos) {
        if (this.wordDefMap.has(word)) return;

        this.wordDefMap.set(word, definition);
        this.posMap.set(word, pos);
        const particle = this.createSemanticParticle(word, definition);
        this.words.push(particle);
        this.scene.add(particle.mesh);
        this.scene.add(particle.text);
      }

      createSemanticParticle(word, definition) {
        const pos = this.posMap.get(word);
        const hue = this.getHueForPOS(pos);
        const geometry = new THREE.SphereGeometry(0.2, 16, 16);
        const material = new THREE.MeshPhongMaterial({ 
          color: new THREE.Color().setHSL(hue, 0.8, 0.5),
          emissive: new THREE.Color().setHSL(hue, 0.9, 0.2)
        });
        const mesh = new THREE.Mesh(geometry, material);
        
        const vector = LanguageTetrahedron.getWordVector(word, definition, 0);
        mesh.position.set(vector.x, vector.y, vector.z);
        
        // Add text label
        const text = this.createTextLabel(word, mesh.position, pos);
        
        return {
          mesh,
          text,
          word,
          definition,
          pos,
          velocity: new THREE.Vector3(),
          frequency: vector.c,
          basePosition: new THREE.Vector3(vector.x, vector.y, vector.z)
        };
      }

      getHueForPOS(pos) {
        // Define distinct colors for each part of speech
        switch(pos) {
          case 'noun': return 0.1; // Green-yellow
          case 'verb': return 0.6; // Blue
          case 'adjective': return 0.9; // Purple
          case 'pronoun': return 0.3; // Orange
          default: return 0.0; // Red
        }
      }

      createTextLabel(word, position, pos) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const context = canvas.getContext('2d');
        context.fillStyle = 'rgba(0, 0, 0, 0.7)';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.font = 'Bold 40px Arial';
        context.textAlign = 'center';
        context.fillStyle = 'white';
        context.fillText(word, canvas.width/2, canvas.height/2 + 15);
        context.font = 'italic 20px Arial';
        context.fillText(`(${pos})`, canvas.width/2, canvas.height/2 + 45);
        
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(material);
        sprite.position.copy(position);
        sprite.position.y += 0.5;
        sprite.scale.set(1.5, 0.75, 1);
        return sprite;
      }

      createSentenceTetrahedron(words) {
        const definitions = words.map(word => this.wordDefMap.get(word));
        const tetra = LanguageTetrahedron.buildSentenceTetrahedron(words, definitions, this.elapsedTime);

        // Create tetrahedron geometry
        const tetraSize = Math.max(1, tetra.frequency * 3);
        const geometry = new THREE.TetrahedronGeometry(tetraSize);
        
        // Create material with opacity
        const material = new THREE.MeshPhongMaterial({
          color: 0x00ff99,
          transparent: true,
          opacity: 0.3,
          wireframe: false
        });
        
        const tetraMesh = new THREE.Mesh(geometry, material);
        tetraMesh.position.set(tetra.centroid.x, tetra.centroid.y, tetra.centroid.z);
        
        // Create wireframe edges
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({ color: 0x00ff99, linewidth: 2 })
        );
        line.position.copy(tetraMesh.position);
        
        // Create centroid force indicator
        const centroidSphere = new THREE.Mesh(
          new THREE.SphereGeometry(0.2, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xff3300 })
        );
        centroidSphere.position.copy(tetraMesh.position);
        
        // Create connections to word points
        const wordPoints = [];
        const connections = [];
        
        for (let word of words) {
          const wordObj = this.words.find(w => w.word === word);
          if (wordObj) {
            wordPoints.push(wordObj.mesh.position);
            
            const lineMaterial = new THREE.LineBasicMaterial({ 
              color: 0xffff00,
              transparent: true,
              opacity: 0.4
            });
            
            const lineGeometry = new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(tetraMesh.position.x, tetraMesh.position.y, tetraMesh.position.z),
              new THREE.Vector3(wordObj.mesh.position.x, wordObj.mesh.position.y, wordObj.mesh.position.z)
            ]);
            
            const connection = new THREE.Line(lineGeometry, lineMaterial);
            connections.push(connection);
            this.scene.add(connection);
          }
        }
        
        // Add everything to the scene
        this.scene.add(tetraMesh);
        this.scene.add(line);
        this.scene.add(centroidSphere);
        
        // Store the sentence object
        this.sentences.push({
          mesh: tetraMesh,
          wireframe: line,
          centroid: centroidSphere,
          words: words,
          definitions: definitions,
          connections: connections,
          frequency: tetra.frequency,
          phase: 0
        });
      }

      animate() {
        requestAnimationFrame(this.animate.bind(this));
        
        const delta = this.clock.getDelta();
        this.elapsedTime += delta;
        
        // Update word particles
        this.words.forEach(word => {
          const time = this.elapsedTime * word.frequency * 0.5;
          const vector = LanguageTetrahedron.getWordVector(word.word, word.definition, time);
          
          word.mesh.position.x = vector.x;
          word.mesh.position.y = vector.y;
          word.mesh.position.z = vector.z;
          
          // Update text position
          word.text.position.copy(word.mesh.position);
          word.text.position.y += 0.5;
        });
        
        // Update sentence tetrahedra
        this.sentences.forEach(sentence => {
          sentence.phase += delta * sentence.frequency;
          
          // Animate the tetrahedron
          sentence.mesh.rotation.x = Math.sin(sentence.phase * 0.5) * 0.2;
          sentence.mesh.rotation.y = sentence.phase * 0.3;
          sentence.wireframe.rotation.copy(sentence.mesh.rotation);
          
          // Pulse the size slightly
          const scale = 1 + Math.sin(sentence.phase * 2) * 0.1;
          sentence.mesh.scale.set(scale, scale, scale);
          sentence.wireframe.scale.copy(sentence.mesh.scale);
          
          // Update connections
          sentence.connections.forEach((connection, i) => {
            const wordObj = this.words.find(w => w.word === sentence.words[i]);
            if (wordObj) {
              const points = [
                sentence.centroid.position,
                wordObj.mesh.position
              ];
              
              connection.geometry.dispose();
              connection.geometry = new THREE.BufferGeometry().setFromPoints(points);
            }
          });
        });
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }
    }

    // Initialize the application
    const app = new SemanticUniverse();
    
    // Add some example words to start with
    setTimeout(() => {
      app.addWordDefinition("cat", "A small domesticated carnivorous mammal", "noun");
      app.addWordDefinition("run", "To move at a speed faster than walking", "verb");
      app.addWordDefinition("happy", "Feeling or showing pleasure or contentment", "adjective");
      app.addWordDefinition("they", "Used to refer to two or more people or things", "pronoun");
      app.addWordDefinition("dog", "A domesticated carnivorous mammal", "noun");
      app.addWordDefinition("jump", "To push oneself off a surface and into the air", "verb");
      app.addWordDefinition("beautiful", "Pleasing the senses or mind aesthetically", "adjective");
      app.addWordDefinition("she", "Used to refer to a female person or animal", "pronoun");
      
      app.updateWordLists();
      app.updateWordSelects();
    }, 500);
  </script>
</body>
</html>
