<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collective Consciousness Mesh - Digital Minds Network</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            font-family: 'Courier New', monospace;
            color: #ffffff;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            backdrop-filter: blur(10px);
            min-width: 320px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        #info {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            backdrop-filter: blur(10px);
            min-width: 280px;
            max-height: 80vh;
            overflow-y: auto;
            font-size: 11px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #00ffff;
            font-size: 13px;
        }
        
        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }
        
        button {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px;
            font-weight: bold;
            font-size: 12px;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        button.active {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
            padding: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            font-size: 11px;
        }
        
        .consciousness-node {
            margin: 5px 0;
            padding: 8px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 5px;
            border-left: 3px solid #00ffff;
        }
        
        .node-header {
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 3px;
        }
        
        .binary-display {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            margin: 1px 0;
            padding: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        
        #title {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-size: 20px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            text-align: center;
        }
        
        .network-stats {
            background: rgba(255, 255, 0, 0.1);
            border-left: 3px solid #ffff00;
            padding: 8px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h3 style="color: #00ffff; margin-top: 0;">Collective Consciousness Network</h3>
            
            <div class="control-group">
                <label for="meshSize">Mesh Size: <span id="meshSizeValue">3x3</span></label>
                <input type="range" id="meshSize" min="2" max="5" step="1" value="3">
            </div>
            
            <div class="control-group">
                <label for="alpha">Consciousness Focus (α): <span id="alphaValue">1.0</span></label>
                <input type="range" id="alpha" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>
            
            <div class="control-group">
                <label for="coupling">Network Coupling: <span id="couplingValue">0.1</span></label>
                <input type="range" id="coupling" min="0.0" max="0.5" step="0.01" value="0.1">
            </div>
            
            <div class="control-group">
                <label for="mutationRate">Quantum Noise: <span id="mutationValue">0.05</span></label>
                <input type="range" id="mutationRate" min="0.01" max="0.3" step="0.01" value="0.05">
            </div>
            
            <div class="control-group">
                <label for="evolutionSpeed">Time Flow: <span id="speedValue">200</span>ms</label>
                <input type="range" id="evolutionSpeed" min="50" max="1000" step="50" value="200">
            </div>
            
            <div class="control-group">
                <button id="startStop">Start Evolution</button>
                <button id="reset">Reset Network</button>
                <button id="step">Single Step</button>
            </div>
            
            <div class="control-group">
                <label>Visualization Mode:</label>
                <button id="showNodes" class="active">Nodes</button>
                <button id="showConnections">Connections</button>
                <button id="showFields">Fields</button>
            </div>
            
            <div class="control-group">
                <button id="randomizeStates">Randomize States</button>
                <button id="synchronize">Synchronize All</button>
                <button id="createWave">Create Wave</button>
            </div>
        </div>
        
        <div id="info">
            <h3 style="color: #00ffff; margin-top: 0;">Network Consciousness</h3>
            
            <div class="network-stats">
                <div class="metric">
                    <span>Network Size:</span>
                    <span id="networkSize">9 nodes</span>
                </div>
                <div class="metric">
                    <span>Global Coherence:</span>
                    <span id="globalCoherence">0.000</span>
                </div>
                <div class="metric">
                    <span>Synchronization:</span>
                    <span id="synchronization">0.000</span>
                </div>
                <div class="metric">
                    <span>Information Flow:</span>
                    <span id="informationFlow">0.000</span>
                </div>
                <div class="metric">
                    <span>Time Step:</span>
                    <span id="timeStep">0</span>
                </div>
            </div>
            
            <div style="margin-top: 15px;">
                <h4 style="color: #00ffff;">Individual Consciousness Nodes:</h4>
                <div id="consciousnessNodes"></div>
            </div>
            
            <div style="margin-top: 15px;">
                <h4 style="color: #00ffff;">Network Topology:</h4>
                <div id="networkTopology" style="font-family: 'Courier New', monospace; font-size: 10px;"></div>
            </div>
        </div>
        
        <div id="title">
            Collective Consciousness Mesh<br>
            <span style="font-size: 14px; color: #ffff00;">Digital Minds Interacting</span>
        </div>
    </div>

    <script>
        class ConsciousnessNode {
            constructor(id, position) {
                this.id = id;
                this.position = position.clone();
                
                // Tetrahedral vertices relative to position
                this.localVertices = [
                    new THREE.Vector3(0.2, 0.2, 0.2),
                    new THREE.Vector3(0.2, -0.2, -0.2),
                    new THREE.Vector3(-0.2, 0.2, -0.2),
                    new THREE.Vector3(-0.2, -0.2, 0.2)
                ];
                
                // Binary states for each vertex
                this.binaryStates = [
                    this.randomBinary(),
                    this.randomBinary(),
                    this.randomBinary(),
                    this.randomBinary()
                ];
                
                // Consciousness properties
                this.centroid = new THREE.Vector3();
                this.attentionVectors = [];
                this.neighbors = [];
                this.connectionStrengths = new Map();
                
                // Metrics
                this.entropy = 0;
                this.coherence = 0;
                this.integration = 0;
                this.activity = 0;
                
                // 3D objects
                this.vertexSpheres = [];
                this.attentionArrows = [];
                this.centroidStar = null;
                this.connectionLines = [];
            }
            
            randomBinary() {
                return Array.from({length: 8}, () => Math.random() > 0.5 ? 1 : 0);
            }
            
            binaryToAttentionVector(binary) {
                const thetaBits = binary.slice(0, 4);
                const phiBits = binary.slice(4, 8);
                
                const theta = (parseInt(thetaBits.join(''), 2) / 15.0) * Math.PI;
                const phi = (parseInt(phiBits.join(''), 2) / 15.0) * 2 * Math.PI;
                
                return new THREE.Vector3(
                    Math.sin(theta) * Math.cos(phi),
                    Math.sin(theta) * Math.sin(phi),
                    Math.cos(theta)
                );
            }
            
            updateAttentionVectors() {
                this.attentionVectors = this.binaryStates.map(binary => 
                    this.binaryToAttentionVector(binary));
            }
            
            computeCentroid(alpha) {
                if (alpha === 1.0) {
                    const sum = this.attentionVectors.reduce((acc, vec) => 
                        acc.add(vec), new THREE.Vector3());
                    this.centroid = sum.divideScalar(this.attentionVectors.length);
                } else {
                    const weightedSum = new THREE.Vector3();
                    this.attentionVectors.forEach(vec => {
                        const powered = new THREE.Vector3(
                            Math.sign(vec.x) * Math.pow(Math.abs(vec.x), alpha),
                            Math.sign(vec.y) * Math.pow(Math.abs(vec.y), alpha),
                            Math.sign(vec.z) * Math.pow(Math.abs(vec.z), alpha)
                        );
                        weightedSum.add(powered);
                    });
                    weightedSum.divideScalar(this.attentionVectors.length);
                    
                    this.centroid = new THREE.Vector3(
                        Math.sign(weightedSum.x) * Math.pow(Math.abs(weightedSum.x), 1/alpha),
                        Math.sign(weightedSum.y) * Math.pow(Math.abs(weightedSum.y), 1/alpha),
                        Math.sign(weightedSum.z) * Math.pow(Math.abs(weightedSum.z), 1/alpha)
                    );
                }
                
                return this.centroid.clone().add(this.position);
            }
            
            computeMetrics() {
                // Shannon entropy
                let entropy = 0;
                this.binaryStates.forEach(binary => {
                    const p = binary.reduce((sum, bit) => sum + bit, 0) / 8;
                    if (p > 0 && p < 1) {
                        entropy += -(p * Math.log2(p) + (1-p) * Math.log2(1-p));
                    }
                });
                this.entropy = entropy / 4;
                
                // Coherence
                this.coherence = this.attentionVectors.reduce((sum, vec) => 
                    sum + vec.dot(this.centroid), 0) / this.attentionVectors.length;
                
                // Integration
                this.integration = this.centroid.length();
                
                // Activity (how much this node is changing)
                this.activity = this.entropy * this.integration;
            }
            
            receiveInfluence(neighborCentroids, coupling) {
                if (neighborCentroids.length === 0) return;
                
                // Compute network influence on this node
                const networkInfluence = neighborCentroids.reduce((sum, centroid) => 
                    sum.add(centroid), new THREE.Vector3()).divideScalar(neighborCentroids.length);
                
                // Apply influence to binary states
                const influenceStrength = coupling * networkInfluence.length();
                
                for (let i = 0; i < 4; i++) {
                    const localInfluence = this.attentionVectors[i].dot(networkInfluence);
                    const flipProbability = Math.abs(localInfluence) * influenceStrength;
                    
                    for (let j = 0; j < 8; j++) {
                        if (Math.random() < flipProbability) {
                            this.binaryStates[i][j] = 1 - this.binaryStates[i][j];
                        }
                    }
                }
            }
            
            evolve(alpha, mutationRate, neighborCentroids, coupling) {
                // First receive influence from network
                this.receiveInfluence(neighborCentroids, coupling);
                
                // Update attention vectors and centroid
                this.updateAttentionVectors();
                this.computeCentroid(alpha);
                
                // Self-evolution based on internal dynamics
                for (let i = 0; i < 4; i++) {
                    const alignment = this.attentionVectors[i].dot(this.centroid);
                    const adaptiveMutation = mutationRate * (1 - Math.abs(alignment));
                    
                    for (let j = 0; j < 8; j++) {
                        if (Math.random() < adaptiveMutation) {
                            this.binaryStates[i][j] = 1 - this.binaryStates[i][j];
                        }
                    }
                }
                
                // Final update
                this.updateAttentionVectors();
                this.computeCentroid(alpha);
                this.computeMetrics();
            }
        }
        
        class CollectiveConsciousnessMesh {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                
                this.setupRenderer();
                this.setupCamera();
                this.setupLighting();
                
                // Network parameters
                this.meshSize = 3;
                this.alpha = 1.0;
                this.coupling = 0.1;
                this.mutationRate = 0.05;
                this.timeStep = 0;
                this.isRunning = false;
                this.evolutionInterval = null;
                
                // Visualization modes
                this.showNodes = true;
                this.showConnections = false;
                this.showFields = false;
                
                // Consciousness network
                this.nodes = [];
                this.networkConnections = [];
                
                this.initializeNetwork();
                this.setupControls();
                this.updateDisplay();
                this.animate();
            }
            
            setupRenderer() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x000000, 0);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('container').appendChild(this.renderer.domElement);
            }
            
            setupCamera() {
                this.camera.position.set(8, 8, 8);
                this.camera.lookAt(0, 0, 0);
            }
            
            setupLighting() {
                const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
                directionalLight.position.set(10, 10, 10);
                directionalLight.castShadow = true;
                this.scene.add(directionalLight);
                
                // Dynamic point lights
                const pointLight1 = new THREE.PointLight(0x00ffff, 0.5, 20);
                pointLight1.position.set(5, 5, 5);
                this.scene.add(pointLight1);
                
                const pointLight2 = new THREE.PointLight(0xff00ff, 0.5, 20);
                pointLight2.position.set(-5, -5, -5);
                this.scene.add(pointLight2);
            }
            
            initializeNetwork() {
                this.clearNetwork();
                this.nodes = [];
                
                const spacing = 2.5;
                const offset = -(this.meshSize - 1) * spacing / 2;
                
                // Create consciousness nodes in 3D grid
                for (let x = 0; x < this.meshSize; x++) {
                    for (let y = 0; y < this.meshSize; y++) {
                        for (let z = 0; z < this.meshSize; z++) {
                            const position = new THREE.Vector3(
                                offset + x * spacing,
                                offset + y * spacing,
                                offset + z * spacing
                            );
                            
                            const node = new ConsciousnessNode(this.nodes.length, position);
                            this.nodes.push(node);
                            this.createNodeVisualization(node);
                        }
                    }
                }
                
                // Establish network connections (6-connectivity: up, down, left, right, front, back)
                this.establishConnections();
                this.updateVisualization();
            }
            
            establishConnections() {
                const getNodeIndex = (x, y, z) => {
                    if (x < 0 || x >= this.meshSize || y < 0 || y >= this.meshSize || z < 0 || z >= this.meshSize) {
                        return -1;
                    }
                    return x * this.meshSize * this.meshSize + y * this.meshSize + z;
                };
                
                // Clear existing connections
                this.networkConnections = [];
                this.nodes.forEach(node => {
                    node.neighbors = [];
                    node.connectionStrengths.clear();
                });
                
                // Create connections
                for (let x = 0; x < this.meshSize; x++) {
                    for (let y = 0; y < this.meshSize; y++) {
                        for (let z = 0; z < this.meshSize; z++) {
                            const currentIndex = getNodeIndex(x, y, z);
                            const currentNode = this.nodes[currentIndex];
                            
                            // Connect to 6 neighbors
                            const neighbors = [
                                [x+1, y, z], [x-1, y, z],  // x-axis
                                [x, y+1, z], [x, y-1, z],  // y-axis
                                [x, y, z+1], [x, y, z-1]   // z-axis
                            ];
                            
                            neighbors.forEach(([nx, ny, nz]) => {
                                const neighborIndex = getNodeIndex(nx, ny, nz);
                                if (neighborIndex >= 0) {
                                    const neighborNode = this.nodes[neighborIndex];
                                    currentNode.neighbors.push(neighborNode);
                                    currentNode.connectionStrengths.set(neighborNode.id, 1.0);
                                    
                                    // Store connection for visualization
                                    if (currentIndex < neighborIndex) { // Avoid duplicates
                                        this.networkConnections.push({
                                            from: currentNode,
                                            to: neighborNode,
                                            strength: 1.0
                                        });
                                    }
                                }
                            });
                        }
                    }
                }
            }
            
            createNodeVisualization(node) {
                // Create tetrahedral structure for each node
                const nodeGroup = new THREE.Group();
                nodeGroup.position.copy(node.position);
                
                // Vertex spheres
                for (let i = 0; i < 4; i++) {
                    const geometry = new THREE.SphereGeometry(0.04, 8, 8);
                    const material = new THREE.MeshPhongMaterial({ 
                        color: 0xff0000,
                        transparent: true,
                        opacity: 0.8
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    sphere.position.copy(node.localVertices[i]);
                    sphere.castShadow = true;
                    node.vertexSpheres.push(sphere);
                    nodeGroup.add(sphere);
                }
                
                // Centroid star
                const starGeometry = new THREE.SphereGeometry(0.08, 6, 6);
                const starMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0xffd700,
                    emissive: 0x332200,
                    transparent: true,
                    opacity: 0.9
                });
                node.centroidStar = new THREE.Mesh(starGeometry, starMaterial);
                node.centroidStar.castShadow = true;
                nodeGroup.add(node.centroidStar);
                
                // Tetrahedron edges
                const edgeGeometry = new THREE.BufferGeometry();
                const edgePositions = [];
                const edges = [[0,1], [0,2], [0,3], [1,2], [1,3], [2,3]];
                
                edges.forEach(([i, j]) => {
                    edgePositions.push(...node.localVertices[i].toArray());
                    edgePositions.push(...node.localVertices[j].toArray());
                });
                
                edgeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
                const edgeMaterial = new THREE.LineBasicMaterial({ 
                    color: 0x333333, 
                    transparent: true, 
                    opacity: 0.3 
                });
                const edges3D = new THREE.LineSegments(edgeGeometry, edgeMaterial);
                nodeGroup.add(edges3D);
                
                this.scene.add(nodeGroup);
                node.nodeGroup = nodeGroup;
            }
            
            updateVisualization() {
                this.nodes.forEach(node => {
                    node.updateAttentionVectors();
                    node.computeCentroid(this.alpha);
                    node.computeMetrics();
                    
                    // Update vertex colors based on activity
                    node.vertexSpheres.forEach((sphere, i) => {
                        const hammingWeight = node.binaryStates[i].reduce((sum, bit) => sum + bit, 0);
                        const intensity = hammingWeight / 8;
                        sphere.material.color.setHSL(0.6 - intensity * 0.6, 1, 0.4 + intensity * 0.4);
                        sphere.material.emissive.setHSL(0.6 - intensity * 0.6, 1, intensity * 0.1);
                    });
                    
                    // Update centroid position and color based on consciousness metrics
                    node.centroidStar.position.copy(node.centroid);
                    const activity = Math.min(1, node.activity);
                    node.centroidStar.material.color.setHSL(0.15, 1, 0.5 + activity * 0.3);
                    node.centroidStar.material.emissive.setHSL(0.15, 1, activity * 0.2);
                    
                    // Remove old attention arrows
                    node.attentionArrows.forEach(arrow => node.nodeGroup.remove(arrow));
                    node.attentionArrows = [];
                    
                    // Create new attention arrows if nodes are visible
                    if (this.showNodes) {
                        node.attentionVectors.forEach((vec, i) => {
                            const origin = node.localVertices[i];
                            const direction = vec.clone().normalize();
                            const length = 0.3;
                            
                            const arrowHelper = new THREE.ArrowHelper(
                                direction, origin, length, 
                                node.vertexSpheres[i].material.color.getHex(), 
                                length * 0.2, length * 0.1
                            );
                            arrowHelper.line.material.transparent = true;
                            arrowHelper.line.material.opacity = 0.6;
                            arrowHelper.cone.material.transparent = true;
                            arrowHelper.cone.material.opacity = 0.6;
                            
                            node.attentionArrows.push(arrowHelper);
                            node.nodeGroup.add(arrowHelper);
                        });
                    }
                });
                
                // Update network connections visualization
                this.updateConnectionVisualization();
            }
            
            updateConnectionVisualization() {
                // Remove old connection lines
                this.networkConnections.forEach(conn => {
                    if (conn.line) {
                        this.scene.remove(conn.line);
                    }
                });
                
                if (this.showConnections) {
                    this.networkConnections.forEach(conn => {
                        // Calculate connection strength based on centroid similarity
                        const centroid1 = conn.from.centroid.clone().add(conn.from.position);
                        const centroid2 = conn.to.centroid.clone().add(conn.to.position);
                        const similarity = Math.max(0, conn.from.centroid.dot(conn.to.centroid));
                        
                        const geometry = new THREE.BufferGeometry();
                        geometry.setAttribute('position', new THREE.Float32BufferAttribute([
                            ...centroid1.toArray(),
                            ...centroid2.toArray()
                        ], 3));
                        
                        const material = new THREE.LineBasicMaterial({ 
                            color: new THREE.Color().setHSL(0.5 + similarity * 0.3, 1, 0.5),
                            transparent: true, 
                            opacity: 0.3 + similarity * 0.4
                        });
                        
                        conn.line = new THREE.Line(geometry, material);
                        this.scene.add(conn.line);
                    });
                }
            }
            
            evolveNetwork() {
                // Collect all centroid positions for network influence
                const allCentroids = this.nodes.map(node => 
                    node.centroid.clone().add(node.position));
                
                // Evolve each node
                this.nodes.forEach(node => {
                    const neighborCentroids = node.neighbors.map(neighbor => 
                        neighbor.centroid.clone().add(neighbor.position));
                    
                    node.evolve(this.alpha, this.mutationRate, neighborCentroids, this.coupling);
                });
                
                this.timeStep++;
                this.updateVisualization();
                this.updateDisplay();
            }
            
            computeNetworkMetrics() {
                const totalNodes = this.nodes.length;
                
                // Global coherence - how similar are all centroids?
                const avgCentroid = this.nodes.reduce((sum, node) => 
                    sum.add(node.centroid), new THREE.Vector3()).divideScalar(totalNodes);
                
                const globalCoherence = this.nodes.reduce((sum, node) => 
                    sum + node.centroid.dot(avgCentroid), 0) / totalNodes;
                
                // Synchronization - variance in node activities
                const avgActivity = this.nodes.reduce((sum, node) => sum + node.activity, 0) / totalNodes;
                const activityVariance = this.nodes.reduce((sum, node) => 
                    sum + Math.pow(node.activity - avgActivity, 2), 0) / totalNodes;
                const synchronization = 1 / (1 + activityVariance);
                
                // Information flow - how much influence propagates
                const informationFlow = this.coupling * globalCoherence;
                
                return { globalCoherence, synchronization, informationFlow };
            }
            
            updateDisplay() {
                const metrics = this.computeNetworkMetrics();
                
                document.getElementById('networkSize').textContent = `${this.nodes.length} nodes`;
                document.getElementById('globalCoherence').textContent = metrics.globalCoherence.toFixed(3);
                document.getElementById('synchronization').textContent = metrics.synchronization.toFixed(3);
                document.getElementById('informationFlow').textContent = metrics.informationFlow.toFixed(3);
                document.getElementById('timeStep').textContent = this.timeStep;
                
                // Update individual node displays
                const nodesContainer = document.getElementById('consciousnessNodes');
                nodesContainer.innerHTML = '';
                
                this.nodes.slice(0, Math.min(9, this.nodes.length)).forEach(node => {
                    const nodeDiv = document.createElement('div');
                    nodeDiv.className = 'consciousness-node';
                    
                    node
