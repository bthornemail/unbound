<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBHP Harmonic Signature Demo</title>
    <style>
        body {
            font-family: 'Consolas', 'Monaco', monospace;
            margin: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #00ffff;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-section {
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #2a2a2a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            font-family: inherit;
            resize: vertical;
        }
        button {
            background: #004400;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            cursor: pointer;
            margin: 10px 5px;
            font-family: inherit;
        }
        button:hover {
            background: #006600;
        }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .signature-box {
            background: #2a2a2a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin: 10px 0;
        }
        .signature-title {
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .similarity-matrix {
            grid-column: 1 / -1;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #00ff00;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #004400;
            color: #00ffff;
        }
        .high-sim {
            background: #004400;
        }
        .med-sim {
            background: #442200;
        }
        .low-sim {
            background: #440000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Universal Binary Hypergraph Protocol (UBHP)</h1>
        <h2 style="color: #00ffff; text-align: center;">Harmonic Signature Demo</h2>
        
        <div class="input-section">
            <h3>Test Content:</h3>
            <textarea id="input1" placeholder="Enter first text...">Hello World</textarea>
            <textarea id="input2" placeholder="Enter second text...">Hello World!</textarea>
            <textarea id="input3" placeholder="Enter third text...">machine learning</textarea>
            <textarea id="input4" placeholder="Enter fourth text...">artificial intelligence</textarea>
            
            <button onclick="generateSignatures()">Generate Harmonic Signatures</button>
            <button onclick="loadSamples()">Load Sample Data</button>
        </div>
        
        <div class="results" id="results"></div>
        
        <div class="similarity-matrix" id="similarity-matrix"></div>
    </div>

    <script>
        // UBHP Harmonic Signature Implementation
        class UBHPHarmonic {
            static harmonize(inputBuffer) {
                const view = new Uint8Array(inputBuffer);
                const values = Array.from(view);
                
                const h = Math.hypot(...values); // Euclidean norm
                const sin = Math.sin(h / Math.PI);
                const cos = Math.cos(h / 1.61803398875); // Golden ratio constant
                const tan = Math.tan(Math.PI / (h || 1e-10)); // Avoid division by zero
                
                const id = `UBHP_${h.toFixed(8)}_${sin.toFixed(8)}_${cos.toFixed(8)}_${view.length}`;
                
                return {
                    id,
                    length: values.length,
                    sin,
                    cos,
                    tan,
                    h,
                    buffer: inputBuffer
                };
            }
            
            static typedArrayToRay(inputBuffer) {
                const input = new Uint8Array(inputBuffer);
                const norm = Math.hypot(...input);
                return norm === 0 ? Array.from(input) : Array.from(input).map(v => v / norm);
            }
            
            static cosineSimilarity(a, b) {
                let dot = 0;
                let normA = 0;
                let normB = 0;
                const len = Math.min(a.length, b.length);
                
                for (let i = 0; i < len; i++) {
                    dot += a[i] * b[i];
                    normA += a[i] * a[i];
                    normB += b[i] * b[i];
                }
                
                const magnitude = Math.sqrt(normA) * Math.sqrt(normB);
                return magnitude === 0 ? 0 : dot / magnitude;
            }
            
            static harmonicDistance(sig1, sig2) {
                // Calculate distance in harmonic space
                const dh = sig1.h - sig2.h;
                const dsin = sig1.sin - sig2.sin;
                const dcos = sig1.cos - sig2.cos;
                return Math.sqrt(dh*dh + dsin*dsin + dcos*dcos);
            }
        }
        
        function generateSignatures() {
            const inputs = [
                document.getElementById('input1').value,
                document.getElementById('input2').value,
                document.getElementById('input3').value,
                document.getElementById('input4').value
            ].filter(text => text.trim() !== '');
            
            const signatures = inputs.map(text => {
                const buffer = new TextEncoder().encode(text).buffer;
                return {
                    text,
                    signature: UBHPHarmonic.harmonize(buffer),
                    ray: UBHPHarmonic.typedArrayToRay(buffer)
                };
            });
            
            displaySignatures(signatures);
            displaySimilarityMatrix(signatures);
        }
        
        function displaySignatures(signatures) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            signatures.forEach((sig, index) => {
                const box = document.createElement('div');
                box.className = 'signature-box';
                box.innerHTML = `
                    <div class="signature-title">Input ${index + 1}: "${sig.text}"</div>
                    <div><strong>ID:</strong> ${sig.signature.id}</div>
                    <div><strong>h (norm):</strong> ${sig.signature.h.toFixed(6)}</div>
                    <div><strong>sin(h/π):</strong> ${sig.signature.sin.toFixed(6)}</div>
                    <div><strong>cos(h/φ):</strong> ${sig.signature.cos.toFixed(6)}</div>
                    <div><strong>tan(π/h):</strong> ${sig.signature.tan.toFixed(6)}</div>
                    <div><strong>Length:</strong> ${sig.signature.length} bytes</div>
                    <div><strong>Ray (first 8):</strong> [${sig.ray.slice(0, 8).map(v => v.toFixed(3)).join(', ')}...]</div>
                `;
                resultsDiv.appendChild(box);
            });
        }
        
        function displaySimilarityMatrix(signatures) {
            const matrixDiv = document.getElementById('similarity-matrix');
            
            if (signatures.length < 2) {
                matrixDiv.innerHTML = '<p>Need at least 2 inputs to show similarity matrix</p>';
                return;
            }
            
            let table = '<h3>Similarity Matrix</h3><table><tr><th>Text</th>';
            signatures.forEach((_, i) => {
                table += `<th>Input ${i + 1}</th>`;
            });
            table += '</tr>';
            
            signatures.forEach((sig1, i) => {
                table += `<tr><td><strong>"${sig1.text.substring(0, 20)}${sig1.text.length > 20 ? '...' : ''}"</strong></td>`;
                signatures.forEach((sig2, j) => {
                    if (i === j) {
                        table += '<td style="background: #004400;">1.000</td>';
                    } else {
                        const cosSim = UBHPHarmonic.cosineSimilarity(sig1.ray, sig2.ray);
                        const harmDist = UBHPHarmonic.harmonicDistance(sig1.signature, sig2.signature);
                        
                        let className = 'low-sim';
                        if (cosSim > 0.8) className = 'high-sim';
                        else if (cosSim > 0.5) className = 'med-sim';
                        
                        table += `<td class="${className}" title="Harmonic Distance: ${harmDist.toFixed(3)}">${cosSim.toFixed(3)}</td>`;
                    }
                });
                table += '</tr>';
            });
            table += '</table>';
            
            matrixDiv.innerHTML = table;
        }
        
        function loadSamples() {
            document.getElementById('input1').value = "Hello World";
            document.getElementById('input2').value = "Hello World!";
            document.getElementById('input3').value = "machine learning";
            document.getElementById('input4').value = "artificial intelligence";
            generateSignatures();
        }
        
        // Generate initial signatures
        loadSamples();
    </script>
</body>
</html>
